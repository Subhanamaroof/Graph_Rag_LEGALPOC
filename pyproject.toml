[project]
name = "graph-rag-poc"
version = "0.1.0"
description = "Learning-oriented Graph RAG proof of concept (MongoDB Atlas Vector Search + Neo4j + Groq)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb==1.5.9",
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "neo4j>=6.4.1",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "sentence-transformers>=6.2.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "graph_rag"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # makes the Streamlit `frontend` package importable in tests

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
frontend = [
    "httpx>=0.28.1",
    "streamlit>=1.40",
]

[tool.uv]
default-groups = ["dev", "frontend"]
